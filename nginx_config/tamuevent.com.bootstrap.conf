# Bootstrap config - HTTP ONLY.
#
# Use this file FIRST, before you have a Let's Encrypt certificate. The real
# config (tamuevent.com.conf) references cert files under
# /etc/letsencrypt/live/tamuevent.com/ that don't exist yet - nginx will
# refuse to start/reload if it's loaded too early. This bootstrap file has no
# `ssl_certificate` directive, so nginx can serve it, which lets certbot's
# HTTP-01 challenge complete over plain port 80. Once the certificate exists,
# switch the enabled symlink to tamuevent.com.conf and never use this file
# again (see nginx_config/README.md, step 4).

server {
    listen 80;
    listen [::]:80;
    server_name tamuevent.com www.tamuevent.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "tamuevent.com bootstrap - waiting for TLS cert\n";
        add_header Content-Type text/plain;
    }
}
