# Production config for tamuevent.com - serves the built React frontend as
# static files and reverse-proxies /api/ to the FastAPI backend (run via
# uvicorn behind the tamuevent-backend systemd service, see
# nginx_config/tamuevent-backend.service).
#
# Deploy layout this file assumes (see nginx_config/README.md for how these
# get created):
#   /var/www/tamuevent/frontend/dist/   <- `npm run build` output
#   /var/www/certbot/                   <- ACME HTTP-01 challenge webroot
#   /etc/letsencrypt/live/tamuevent.com/ <- certbot-managed certificate
#
# Do NOT enable this file until the certificate actually exists - use
# tamuevent.com.bootstrap.conf to obtain it first.

upstream tamuevent_backend {
    server 127.0.0.1:9191;
    keepalive 32;
}

# Optional: restores the real visitor IP in $remote_addr when traffic is
# proxied through Cloudflare (recommended, but only useful once you've
# installed nginx_config/cloudflare-realip.conf - see README.md step 6).
# include /etc/nginx/cloudflare-realip.conf;

# Plain HTTP: only job is the ACME challenge + redirect to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name tamuevent.com www.tamuevent.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tamuevent.com www.tamuevent.com;

    ssl_certificate     /etc/letsencrypt/live/tamuevent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tamuevent.com/privkey.pem;

    # Modern TLS settings (mirrors certbot's recommended intermediate
    # config), inlined here so this file doesn't depend on certbot having
    # written /etc/letsencrypt/options-ssl-nginx.conf.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:tamuevent_ssl:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /var/www/tamuevent/frontend/dist;
    index index.html;

    # Vite emits content-hashed filenames under /assets/, safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # FastAPI backend - proxy_pass has no trailing path, so nginx forwards
    # the request URI unchanged (e.g. /api/events/search stays
    # /api/events/search on the backend, matching backend.py's route).
    location /api/ {
        proxy_pass http://tamuevent_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: serve index.html for any route not matching a static
    # file, so client-side routing (if/when added) doesn't 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
